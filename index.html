<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #4a90e2; --bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        
        /* Step Cards Animation */
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; animation: fadeInUp 0.8s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { color: #333; font-size: 1.5rem; margin-bottom: 20px; }
        .step-num { background: var(--primary); color: white; padding: 5px 12px; border-radius: 50%; font-size: 12px; margin-right: 10px; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #357abd; transform: scale(1.02); }
        
        #qr-canvas { margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
        .help-text { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; color: var(--primary);">GET-QR.COM</h1>

    <!-- Step 1 -->
    <div class="card">
        <h2><span class="step-num">1</span>Enter Content</h2>
        <input type="text" id="qr-text" placeholder="URL, Google Drive link, Text...">
        <p class="help-text">PDF/PPT ke liye pehle unhe Google Drive pe upload karke link yahan dalein.</p>
    </div>

    <!-- Step 2 -->
    <div class="card">
        <h2><span class="step-num">2</span>Customize (Optional)</h2>
        <label>Center Logo/Image:</label>
        <input type="file" id="qr-logo" accept="image/*">
    </div>

    <button onclick="generateQR()">Generate & Download</button>

    <div id="qr-result" class="card" style="display:none; text-align:center;">
        <canvas id="final-canvas" width="250" height="250"></canvas>
    </div>
</div>

<div id="temp-qr" style="display:none;"></div>

<script>
    function generateQR() {
        const text = document.getElementById('qr-text').value;
        const logoInput = document.getElementById('qr-logo');
        const tempContainer = document.getElementById('temp-qr');
        const canvas = document.getElementById('final-canvas');
        const ctx = canvas.getContext('2d');
        const resultCard = document.getElementById('qr-result');

        if (!text) return alert("Kuch enter toh karein!");

        tempContainer.innerHTML = '';
        new QRCode(tempContainer, { text: text, width: 250, height: 250, correctLevel: QRCode.CorrectLevel.H });

        setTimeout(() => {
            const qrImage = tempContainer.querySelector('img');
            const img = new Image();
            img.src = qrImage.src;
            img.onload = () => {
                ctx.clearRect(0, 0, 250, 250);
                ctx.drawImage(img, 0, 0, 250, 250);

                if (logoInput.files && logoInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const logo = new Image();
                        logo.src = e.target.result;
                        logo.onload = () => {
                            ctx.fillStyle = "white";
                            ctx.fillRect(100, 100, 50, 50); // Logo background
                            ctx.drawImage(logo, 105, 105, 40, 40);
                            resultCard.style.display = 'block';
                        };
                    };
                    reader.readAsDataURL(logoInput.files[0]);
                } else {
                    resultCard.style.display = 'block';
                }
            };
        }, 500);
    }
</script>

</body>
</html>
